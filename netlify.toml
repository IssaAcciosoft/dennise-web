# Despliegue en Netlify (sitio estático de Astro).
# En Netlify → Site configuration → Environment variables, define SITE_URL con el dominio final
# (p. ej. https://www.dominio.es) para que canonical, Open Graph y sitemap usen URLs absolutas correctas.
# Si no se define, se usa la URL que asigna Netlify (variables URL / DEPLOY_PRIME_URL).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Recursos con hash en el nombre: caché de larga duración.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# /dubai/ pasó a /apertura-de-empresas/ (la sección de Dubái está en #dubai). force: aunque exista
# dist/dubai/index.html (la redirección de respaldo que genera Astro), Netlify responde con 301.
[[redirects]]
  from = "/dubai/"
  to = "/apertura-de-empresas/"
  status = 301
  force = true

[[redirects]]
  from = "/dubai"
  to = "/apertura-de-empresas/"
  status = 301
  force = true
