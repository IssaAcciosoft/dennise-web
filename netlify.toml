# Despliegue en Netlify (sitio estático de Astro).
# Dominio principal: https://dggestoresyabogados.com (Domain management → dominio principal, con
# HTTPS). Netlify redirige solo denisseg.netlify.app y www al dominio principal.
# astro.config.mjs usa ese dominio en producción y DEPLOY_PRIME_URL en las vistas previas;
# SITE_URL solo hace falta para forzar otro.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Recursos con hash en el nombre: caché de larga duración.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# /dubai/ pasó a /apertura-de-empresas/ (la sección de Dubái está en #dubai). force: aunque exista
# dist/dubai/index.html (la redirección de respaldo que genera Astro), Netlify responde con 301.
[[redirects]]
  from = "/dubai/"
  to = "/apertura-de-empresas/"
  status = 301
  force = true

[[redirects]]
  from = "/dubai"
  to = "/apertura-de-empresas/"
  status = 301
  force = true
